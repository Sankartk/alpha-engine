[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-engine"
version = "0.1.0"
description = "Quantitative strategy backtester with walk-forward validation and Alpaca paper trading"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "pyarrow>=15.0",
    "plotly>=5.20",
    "streamlit>=1.32",
]

[project.optional-dependencies]
live = ["alpaca-py>=0.20"]
dev  = ["pytest>=8.0", "pytest-cov>=4.1", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["alpha_engine*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
